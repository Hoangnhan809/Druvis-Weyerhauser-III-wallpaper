<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fleur+De+Leah&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #background {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;
            z-index: -1;
        }

        div {
            font-family: "Fleur De Leah", cursive;
            font-weight: 400;
            font-style: normal;
            font-size: 60px;
            display: flex;
            flex-direction: column;
            color: rgba(255, 255, 255, 0.45);
        }

        div span {
            display: inline-block;
            min-height: 1.2em;
        }

        #left {
            position: absolute;
            height: 30vh;
            width: 40vw;
            left: 3vw;
            top: 70%;
            transform: translateY(-50%);
        }

        #right {
            position: absolute;
            height: 30vh;
            width: 40vw;
            left: 72vw;
            top: 50%;
            transform: translateY(-50%);
        }

        @keyframes particle {
            0% {
                transform: translate(0, 0) scale(0);
            }
            50% {
                transform: translate(calc(var(--dirX) * 0.5), calc(var(--dirY) * 0.5)) scale(1);
            }
            100% {
                transform: translate(var(--dirX), var(--dirY)) scale(0);
            }
        }

        @keyframes pulse {
            0% {
                color: rgba(255, 255, 255, 0.45);
            }
            25% {
                color: rgba(255, 255, 255, 1);
                filter: brightness(2.5);
            }
            100% {
                color: rgba(255, 255, 255, 0.45);
            }
        }

        @keyframes fade {
            0% {
                color: rgba(255, 255, 255, 0.45);
                filter: brightness(1);
                text-shadow: none;
            }
            30% {
                color: rgba(255, 255, 255, 1);
                filter: brightness(2.5);
                text-shadow: 0 0 20px rgba(255, 255, 255, 1), 
                             0 0 40px rgba(255, 255, 255, 0.75), 
                             0 0 50px rgba(255, 255, 255, 0.5);
            }
            100% {
            
                color: rgba(255, 255, 255, 0);
                filter: brightness(1);
                text-shadow: none;
            }
        }

        @keyframes fadeshadow {
            0% {
                text-shadow: 0 0 10px #fff, 0 0 20px #fff;
            }
            30% {
                text-shadow: 0 0 20px rgba(255, 255, 255, 1), 
                             0 0 40px rgba(255, 255, 255, 0.75), 
                             0 0 50px rgba(255, 255, 255, 0.5);
            }
            100% {
                text-shadow: none;
            }
        }

        .particle {
            object-fit: cover;
            animation: particle 690ms linear forwards;
            color: rgba(255, 255, 255, 0.45);
            filter: brightness(0.8);
        }

        .pulse {
            animation: pulse var(--pt) ease-in-out forwards;
        }

        .fade {
            animation: fade 2.5s ease-in-out forwards;
        }

        .fadeshadow{
            animation: fadeshadow 2.5s ease-in-out forwards;
        }

    </style>
</head>

<body>

    <video id="background" autoplay muted loop playsinline>
        <source src="Druvis.mp4" type="video/mp4">
    </video>

    <div id="left">
        <span data-text="Let everything happen to you:"></span>
        <span data-text="beauty and terror."></span>
    </div>
    <div id="right">
        <span data-text="Just keep going."></span>
        <span data-text="No feeling is final."></span>
    </div>

    <script>
        const lines = document.querySelectorAll("div span");
        let click = false;

        function particle (size, dirX, dirY) {
            this.size = size;
            this.dirX = dirX;
            this.dirY = dirY;
        }

        function createParticle(p, src) {
            const img = document.createElement("img");
            img.src = src;
            img.style.width = img.style.height = p.size + "px";
            img.style.position = "absolute";
            img.className = "particle";
            img.style.setProperty("--dirX", p.dirX + "px");
            img.style.setProperty("--dirY", p.dirY + "px");
            img.style.translate = "30px 30px"
            return img;
        }

        function animate(e, t, s, cb){
            let l = t.length;
            let i = 0;
            let interval = setInterval(() => {
                if (i < l) {
                    let c = document.createElement("span");
                    c.textContent = t.charAt(i);
                    c.style.position = "relative";
                    c.style.display = "inline-block";
                    c.style.whiteSpace = "pre";
                    c.style.textShadow = "0 0 10px #fff, 0 0 20px #fff";
                    c.classList.add("pulse");
                    c.style.setProperty("--pt", s*4 + "ms");


                    //const p2 = new particle(Math.floor(Math.random() * 24) + 1, (Math.random()-0.5) * 100 + 1, (Math.random()-0.5) * 100 + 1);
                    //const p3 = new particle(Math.floor(Math.random() * 24) + 1, (Math.random()-0.5) * 100 + 1, (Math.random()-0.5) * 100 + 1);
                    const p1 = new particle(Math.floor(Math.random() * 24) + 1, (Math.random()-0.5) * 100 + 1, (Math.random()-0.5) * 100 + 1);


                    let c1 = createParticle(p1, "branch.png"); 
                    //let c2 = createParticle(p2, "branch.png"); 
                    //let c3 = createParticle(p3, "branch.png");

                    c.appendChild(c1);
                    //c.appendChild(c2);
                    //c.appendChild(c3);
                    e.appendChild(c);

                    setTimeout(() => {
                        c1.remove();
                        //c2.remove();
                        //c3.remove();
                        c.classList.remove("pulse");
                    }, 690);
                    i++;
                } else {
                    clearInterval(interval);
                    if (cb) cb();
                }
            }, s);
        }

        document.addEventListener("click", () => {
            if (!click) {
                click = true;
                let i = 0;
                function nextLine() {
                    if (i < lines.length) {
                        let line = lines[i];
                        let text = line.getAttribute("data-text");
                        animate(line, text, 80, () => {
                            if(i%2==0){
                                setTimeout(nextLine, 320);
                            } else {
                                setTimeout(nextLine, 560);
                            }
                            i++;
                        });
                    } else {
                        setTimeout(() => {
                            const containers = document.querySelectorAll("#left, #right");
                            containers.forEach(div => div.classList.add("fade"));
                            document.querySelectorAll("#left span span, #right span span").forEach(c => {
                                c.style.textShadow = "none";
                                c.classList.add("fadeshadow");
                            });
                            setTimeout(() => {
                                containers.forEach(div => div.classList.remove("fade"));
                                lines.forEach(line => {
                                    while (line.firstChild) {
                                        line.removeChild(line.firstChild); 
                                    }
                                    line.textContent = ""; 
                                });
                                click = false; 
                            }, 2500);
                        }, 1000);
                    }
                }
                nextLine();
            }
        });
    </script>

</body>
</html>
